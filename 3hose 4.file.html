<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<link rel="icon" href="data:,">
<title>3House Cafe — مدیریت کافه</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#eee;font-family:Tahoma,Arial,sans-serif;line-height:1.6}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #d9b55d;outline-offset:2px}
.gold{color:#d9b55d}.green{color:#8fd39a}.red{color:#e58b8b}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:min(440px,100%);background:#141414;border:1px solid #34302a;border-radius:20px;padding:28px;box-shadow:0 20px 70px #000}
.logo img{display:block;width:170px;max-height:130px;object-fit:contain;margin:auto}
h1{font-size:21px;text-align:center;margin:20px 0}
label{display:block;color:#aaa;font-size:12px;margin:12px 0 6px}
input,select{width:100%;background:#0e0e0e;border:1px solid #383838;color:#fff;border-radius:9px;padding:11px}
input[type=checkbox]{width:auto}
.primary{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#c9a652;color:#111;font-weight:bold}
.muted{color:#888;font-size:11px;text-align:center;margin-top:12px}
.side{width:250px;position:fixed;right:0;top:0;bottom:0;background:#111;border-left:1px solid #292929;padding:16px;overflow:auto;z-index:40;transition:transform .2s}
.brand{text-align:center;padding-bottom:14px;border-bottom:1px solid #292929;margin-bottom:10px}
.brand img{width:110px;height:70px;object-fit:contain}
.nav button{display:block;width:100%;border:0;background:none;color:#bbb;text-align:right;padding:11px 12px;border-radius:9px;margin:3px 0}
.nav button:hover,.nav button.active{background:#292318;color:#e0bd63}
.logout{width:100%;margin-top:14px}
.main{margin-right:250px;padding:22px;max-width:1400px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.toph{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:22px}
.userbadge{border:1px solid #383838;border-radius:20px;padding:8px 12px;color:#d9b55d;font-size:13px}
.section{margin-top:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card,.panel{background:#151515;border:1px solid #2c2c2c;border-radius:14px;padding:15px}
.panel h3{margin:0 0 12px;font-size:16px}
.label{color:#999;font-size:12px}
.value{font-size:23px;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.action{padding:15px;text-align:center;border:1px solid #333;border-radius:11px;background:#181818;color:#ddd}
.action:hover,.action.on{border-color:#c9a652;color:#e0bd63}
.action.on{background:#292318}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #292929;padding:11px 0;font-size:13px;flex-wrap:wrap}
.row:last-child{border:0}
.row input,.row select{max-width:220px}
.badge{background:#292318;color:#e0bd63;padding:4px 9px;border-radius:15px;font-size:11px;white-space:nowrap}
.badge.ok{background:#1b2a1e;color:#8fd39a}.badge.bad{background:#2d1b1b;color:#e58b8b}
.btn{border:1px solid #555;background:#1a1a1a;color:#eee;border-radius:8px;padding:8px 11px;text-decoration:none;display:inline-block}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.goldbtn{background:#c9a652;color:#111;border-color:#c9a652}
.btn.danger{color:#ffb0b0;border-color:#704040}
.burger{display:none}
.orderbox{border:1px solid #343434;border-radius:12px;padding:12px;margin-top:10px}
.footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ph h3{margin:0}
.cat{color:#d9b55d;font-size:12px;margin:16px 0 4px;padding-bottom:4px;border-bottom:1px solid #2c2c2c}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.pickb{background:#181818;border:1px solid #333;border-radius:10px;color:#eee;padding:10px;text-align:right;display:flex;flex-direction:column;gap:2px}
.pickb:hover{border-color:#c9a652}
.pickb small{color:#d9b55d}
.qty{display:inline-flex;align-items:center;gap:8px}
.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.check{background:#111;border:1px solid #333;border-radius:8px;padding:9px}
.check label,.chk{display:flex;align-items:center;gap:8px;margin:0;color:#ddd;font-size:13px}
.inv{white-space:pre-wrap;background:#0e0e0e;border:1px solid #333;border-radius:10px;padding:12px;font-family:inherit;font-size:13px;margin:12px 0 0}
.modal-bg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{width:min(480px,100%);background:#141414;border:1px solid #34302a;border-radius:16px;padding:20px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#292318;color:#e0bd63;border:1px solid #c9a652;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;text-align:center;font-size:13px}
#toast.show{opacity:1;transform:translateX(-50%)}
.pubmenu{max-width:640px;margin:0 auto;padding:24px 16px}
.pubmenu .row b{color:#e0bd63}
@media(max-width:900px){
 .burger{display:inline-block}
 .side{transform:translateX(100%)}
 .side.open{transform:none;box-shadow:0 0 40px #000}
 .main{margin:0;padding:16px}
 .cards{grid-template-columns:1fr 1fr}
 .grid,.actions{grid-template-columns:1fr}
}
@media(max-width:520px){.cards{grid-template-columns:1fr}.checkgrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
 #root,#toast{display:none!important}
 .modal-bg{position:static;background:none;display:block;padding:0}
 .modal{border:0;background:#fff;color:#000;width:100%;max-height:none}
 .noprint{display:none!important}
 .inv{background:#fff;color:#000;border:0}
}
</style>
</head>

/* ───────── SHA-256 (رمزها به‌صورت هش ذخیره می‌شوند) ───────── */
const K256=[],H256=[];
(function(){let n=2,c=0;while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}
  if(p){if(c<8)H256[c]=(Math.pow(n,.5)%1)*4294967296|0;K256[c]=(Math.pow(n,1/3)%1)*4294967296|0;c++}n++}})();
function sha256(str){
  const b=new TextEncoder().encode(str),l=b.length,w8=new Uint8Array(((l+9+63)>>6)<<6);
  w8.set(b);w8[l]=0x80;const dv=new DataView(w8.buffer);
  dv.setUint32(w8.length-4,(l*8)>>>0);dv.setUint32(w8.length-8,Math.floor(l*8/4294967296));
  let h=H256.slice();const w=new Array(64);
  for(let o=0;o<w8.length;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4)|0;
    for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];
      const s0=(a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3),s1=(c>>>17|c<<15)^(c>>>19|c<<13)^(c>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let [a,b2,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const S1=(e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K256[i]+w[i])|0;
      const S0=(a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0}
    h=[h[0]+a|0,h[1]+b2|0,h[2]+c|0,h[3]+d|0,h[4]+e|0,h[5]+f|0,h[6]+g|0,h[7]+hh|0];
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
const passHash=(u,p)=>sha256('3house|'+u.toLowerCase()+'|'+p);

}

/* ───────── محاسبات سفارش ───────── */
const pending=o=>Object.values(o.st).some(v=>v!=='done');
const openOrderOf=t=>db.orders.find(o=>o.type==='dine'&&o.tableId===t.id&&!o.canceled&&(!o.paid||pending(o)));
function tableState(t){const o=openOrderOf(t);if(!o)return'free';if(o.paid)return'ordering';return pending(o)?'ordering':'awaitpay'}
function prepLabel(o){const v=Object.values(o.st);if(!v.length)return'—';if(v.every(x=>x==='done'))return ST.done;if(v.every(x=>x==='ready'||x==='done'))return ST.ready;if(v.some(x=>x!=='new'))return ST.preparing;return ST.new}
const where=o=>o.type==='dine'?(db.tables.find(t=>t.id===o.tableId)||{name:'میز؟'}).name:(o.name||o.phone||TYPES[o.type]);
const itemPrice=m=>Math.round(m.price*(draft&&draft.type==='online'?1+db.settings.onlineMarkup/100:1));
const newDraft=(type,tableId='')=>({type,tableId,phone:'',name:'',items:{},code:'',disc:null,usePts:false,cust:null});
function calc(d){
  const lines=Object.entries(d.items).map(([id,q])=>{const m=db.menu.find(x=>x.id===id);return m&&q>0?{mid:id,name:m.name,price:itemPrice(m),qty:q,st:m.st}:null}).filter(Boolean);
  const sub=sum(lines,l=>l.price*l.qty);
  let disc=0,label='';
  if(d.disc){disc=d.disc.type==='percent'?Math.round(sub*Math.min(d.disc.value,100)/100):Math.min(d.disc.value,sub);label='کد '+d.disc.code}
  const pv=db.settings.pointValue||1;
  const pts=d.usePts&&d.cust?Math.max(0,Math.min(d.cust.points,Math.floor((sub-disc)/pv))):0;
  const base=Math.max(0,sub-disc-pts*pv);
  const tax=Math.round(base*db.settings.tax/100);
  return{lines,sub,disc,label,pts,ptsAmt:pts*pv,tax,total:base+tax};
}
function invoiceText(o){
  const s=db.settings,L=[`☕ ${s.cafe}`,`فاکتور شماره ${o.no} — ${fdt(o.at)}`,'──────────'];
  o.items.forEach(i=>L.push(`${i.name} × ${i.qty}   ${fmt(i.price*i.qty)}`));
  L.push('──────────',`جمع: ${fmt(o.sub)}`);
  if(o.disc)L.push(`تخفیف: ${fmt(o.disc)}`);
  if(o.ptsAmt)L.push(`امتیاز: ${fmt(o.ptsAmt)}`);
  L.push(`مالیات (${fmt(o.taxRate)}٪): ${fmt(o.tax)}`,`مبلغ نهایی: ${fmt(o.total)} تومان`);
  if(!o.paid&&s.card)L.push(`شماره کارت: ${s.card}`);
  if(!o.paid&&s.payLink)L.push(`لینک پرداخت: ${s.payLink}`);
  return L.join('\n');
}

}

A.dec=id=>{if(!draft)return;if((draft.items[id]||0)<=1)delete draft.items[id];else draft.items[id]--;cartRefresh()};
A.applyCode=()=>{
  const c=draft.code.trim().toLowerCase();
  const d=c&&db.discounts.find(x=>x.on&&x.code.toLowerCase()===c);
  draft.disc=d||null;
  if(!d)toast(c?'این کد تخفیف معتبر نیست':'کد تخفیف را وارد کنید');
  cartRefresh();
};
I.dPhone=v=>{if(draft)draft.phone=v};I.dName=v=>{if(draft)draft.name=v};I.dCode=v=>{if(draft)draft.code=v};
C.dTable=v=>{if(draft)draft.tableId=v};
C.dPts=(v,el)=>{draft.usePts=el.checked;cartRefresh()};
C.dLookup=()=>{
  const d=draft;if(!d)return;const p=nph(d.phone);
  const c=p?db.customers.find(x=>nph(x.phone)===p):null;
  d.cust=c||null;
  if(c&&!d.name){d.name=c.name;const n=$('[data-i="dName"]');if(n)n.value=c.name}
  if(!c)d.usePts=false;
  cartRefresh();
};
A.saveOrder=()=>{
  const d=draft;if(!d)return;const c=calc(d);
  if(!c.lines.length)return toast('حداقل یک آیتم انتخاب کنید');
  if(d.type==='dine'){const t=find(db.tables,d.tableId);if(!t)return toast('میز را انتخاب کنید');if(tableState(t)!=='free')return toast('این میز آزاد نیست')}
  const phone=nph(d.phone);
  if(d.type==='online'&&phone.length<10)return toast('برای سفارش آنلاین شماره تماس معتبر لازم است');
  let cust=d.cust?find(db.customers,d.cust.id):null;
  if(!cust&&phone.length>=10){cust=db.customers.find(x=>nph(x.phone)===phone);if(!cust){cust={id:uid(),name:d.name.trim()||phone,phone,points:0,at:Date.now()};db.customers.push(cust)}}
  const pts=cust&&d.usePts?c.pts:0;
  if(cust&&pts)cust.points-=pts;
  const st={};c.lines.forEach(l=>st[l.st]='new');
  const o={id:uid(),no:db.seq++,type:d.type,tableId:d.tableId||'',phone,name:d.name.trim(),customerId:cust?cust.id:'',items:c.lines,sub:c.sub,disc:c.disc,discLabel:c.label,pts,ptsAmt:pts?c.ptsAmt:0,taxRate:db.settings.tax,tax:c.tax,total:c.total,st,paid:false,method:'',canceled:false,at:Date.now(),by:me.username};
  db.orders.push(o);draft=null;save();toast('سفارش شماره '+fmt(o.no)+' ثبت شد');refresh();
};
A.pay=id=>{
  const o=find(db.orders,id);if(!o)return;
  showModal(`<h3>پرداخت سفارش ${fmt(o.no)}</h3><div class="row"><b>مبلغ قابل پرداخت</b><b class="gold">${fmt(o.total)} تومان</b></div>
   ${db.settings.card?`<p class="label">شماره کارت: ${esc(db.settings.card)}</p>`:''}<div class="actions">${Object.entries(PM).map(([k,v])=>btn(v,'payWith',o.id+'|'+k,'action')).join('')}</div><div class="footer-actions">${btn('انصراف','close')}</div>`);
};
A.payWith=v=>{
  const [id,m]=v.split('|'),o=find(db.orders,id);if(!o||o.paid||o.canceled)return;
  o.paid=true;o.method=m;o.paidAt=Date.now();
  const c=find(db.customers,o.customerId);
  if(c&&db.settings.pointsPer>0)c.points+=Math.floor(o.total/db.settings.pointsPer);
  save();closeModal();refresh();showInvoice(o.id);
};
A.cancelOrder=id=>{
  const o=find(db.orders,id);if(!o||o.paid)return;
  if(!confirm('سفارش '+fmt(o.no)+' لغو شود؟'))return;
  o.canceled=true;const c=find(db.customers,o.customerId);if(c&&o.pts)c.points+=o.pts;
  save();refresh();
};
A.invoice=id=>showInvoice(id);
A.stNext=v=>{
  const [id,s]=v.split('|'),o=find(db.orders,id);if(!o)return;
  const n={new:'preparing',preparing:'ready',ready:'done'}[o.st[s]];if(n){o.st[s]=n;save();refresh()}
};

  if(db.discounts.some(d=>d.code.toLowerCase()===o.code.toLowerCase()))return toast('این کد قبلاً تعریف شده است'),false;
  db.discounts.push({id:uid(),code:o.code,type:o.type,value:o.value,on:true});save();refresh();
});
A.discToggle=id=>{const d=find(db.discounts,id);if(d){d.on=!d.on;save();refresh()}};
A.discDel=id=>{const d=find(db.discounts,id);if(d&&confirm('کد «'+d.code+'» حذف شود؟')){db.discounts=db.discounts.filter(x=>x.id!==id);save();refresh()}};
FORMS.loyaltyRules=f=>{
  const fd=new FormData(f),a=toNum(fd.get('pointsPer')),b=toNum(fd.get('pointValue'));
  if(a<0||b<=0)return toast('مقادیر معتبر وارد کنید');
  db.settings.pointsPer=a;db.settings.pointValue=b;save();toast('ذخیره شد');
};

/* مالی */
C.finMonth=v=>{finM=v;refresh()};
A.expForm=()=>openForm('ثبت هزینه',[{k:'title',l:'شرح',p:'مثلاً خرید قهوه'},{k:'cat',l:'دسته',t:'select',o:['مواد اولیه','حقوق','اجاره و قبوض','سایر'].map(x=>[x,x]),v:'مواد اولیه'},{k:'amount',l:'مبلغ (تومان)',t:'num'}],o=>{
  if(!o.title)return toast('شرح هزینه را وارد کنید'),false;
  if(!(o.amount>0))return toast('مبلغ باید بیشتر از صفر باشد'),false;
  db.expenses.push({id:uid(),title:o.title,cat:o.cat,amount:o.amount,at:Date.now()});save();refresh();
});
A.expDel=id=>{if(confirm('این هزینه حذف شود؟')){db.expenses=db.expenses.filter(x=>x.id!==id);save();refresh()}};

/* پرسنل */
A.staffForm=id=>{
  const s=id?find(db.staff,id):null;
  openForm(s?'ویرایش پرسنل':'پرسنل جدید',[{k:'personId',l:'شناسه پرسنلی',v:s?s.personId:String(1001+db.staff.length)},{k:'name',l:'نام',v:s&&s.name},{k:'mobile',l:'شماره موبایل',v:s&&s.mobile},{k:'account',l:'شماره حساب',v:s&&s.account},{k:'sheba',l:'شبا',v:s&&s.sheba},{k:'salary',l:'حقوق ماهانه (تومان)',t:'num',v:s&&s.salary}],o=>{
    if(!o.name)return toast('نام را وارد کنید'),false;
    if(o.salary<0)return toast('حقوق نمی‌تواند منفی باشد'),false;
    if(s)Object.assign(s,o);else db.staff.push(Object.assign({id:uid()},o));
    save();refresh();
  });
};
A.staffShow=id=>{shown.has(id)?shown.delete(id):shown.add(id);refresh()};
A.staffDel=id=>{const s=find(db.staff,id);if(s&&confirm('«'+s.name+'» حذف شود؟')){db.staff=db.staff.filter(x=>x.id!==id);save();refresh()}};
A.staffPay=id=>{
  const s=find(db.staff,id);if(!s)return;
  if(!(s.salary>0))return toast('ابتدا حقوق را ثبت کنید');
  if(!confirm('پرداخت حقوق '+s.name+' به مبلغ '+fmt(s.salary)+' تومان به هزینه‌های این ماه اضافه شود؟'))return;
  db.expenses.push({id:uid(),title:'حقوق — '+s.name,cat:'حقوق',amount:s.salary,at:Date.now()});save();toast('در هزینه‌های ماه ثبت شد');
};

/* کاربران */
A.userForm=()=>openForm('کاربر جدید',[{k:'username',l:'نام کاربری'},{k:'password',l:'رمز عبور (حداقل ۶ نویسه)',t:'password'},{k:'personId',l:'شناسه پرسنلی'},{k:'role',l:'نقش',t:'select',o:[['user','کاربر'],['manager','مدیر']],v:'user'}],o=>{
  if(!/^[\w.\-\u0600-\u06FF]{3,30}$/.test(o.username))return toast('نام کاربری باید ۳ تا ۳۰ نویسه (حرف، عدد، . _ -) باشد'),false;
  if(o.password.length<6)return toast('رمز عبور حداقل ۶ نویسه باشد'),false;
  if(db.users.some(u=>u.username.toLowerCase()===o.username.toLowerCase()))return toast('این نام کاربری قبلاً وجود دارد'),false;
  db.users.push({id:uid(),username:o.username,pass:passHash(o.username,o.password),role:o.role,personId:o.personId,perms:Object.assign({},DEF_PERMS)});save();refresh();
});
A.userPass=id=>{
  const u=find(db.users,id);if(!u)return;
  openForm('تغییر رمز — '+u.username,[{k:'p',l:'رمز جدید (حداقل ۶ نویسه)',t:'password'}],o=>{
    if(o.p.length<6)return toast('رمز عبور حداقل ۶ نویسه باشد'),false;
    u.pass=passHash(u.username,o.p);save();toast('رمز تغییر کرد');
  });
};
A.userDel=id=>{
  const u=find(db.users,id);if(!u||u.id===me.id)return;
  if(u.role==='manager'&&db.users.filter(x=>x.role==='manager').length<2)return toast('حداقل یک مدیر باید بماند');
  if(confirm('کاربر «'+u.username+'» حذف شود؟')){db.users=db.users.filter(x=>x.id!==id);save();refresh()}
};
C.perm=(v,el)=>{const [id,p]=el.dataset.id.split('|'),u=find(db.users,id);if(u){u.perms=u.perms||{};u.perms[p]=el.checked?1:0;save()}};

/* آنلاین و تنظیمات */
C.onlineOn=(v,el)=>{db.settings.onlineOn=el.checked;save();toast(el.checked?'فعال شد':'غیرفعال شد')};
FORMS.onlineMarkup=f=>{const m=toNum(new FormData(f).get('m'));if(m<0||m>100)return toast('عددی بین ۰ تا ۱۰۰ وارد کنید');db.settings.onlineMarkup=m;save();toast('ذخیره شد')};
FORMS.settings=f=>{
  const fd=new FormData(f),tax=toNum(fd.get('tax'));
  if(!String(fd.get('cafe')).trim())return toast('نام کافه را وارد کنید');
  if(tax<0||tax>100)return toast('نرخ مالیات باید بین ۰ تا ۱۰۰ باشد');
  Object.assign(db.settings,{cafe:String(fd.get('cafe')).trim(),tax,card:String(fd.get('card')).trim(),payLink:String(fd.get('payLink')).trim()});
  save();render();toast('ذخیره شد');
};
A.export=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
  a.download='3house-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
C.importFile=(v,el)=>{
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{
    try{
      const d=norm(JSON.parse(r.result));
      if(!d.users.some(u=>u.role==='manager'&&u.pass))throw 0;
      if(!confirm('اطلاعات فعلی با این فایل جایگزین می‌شود. ادامه می‌دهید؟'))return;
      db=d;draft=null;save();me=find(db.users,me&&me.id)||null;if(!me)sessionStorage.removeItem(SKEY);render();toast('بازگردانی انجام شد');
    }catch(e){toast('فایل پشتیبان معتبر نیست')}
  };
  r.readAsText(f);el.value='';
};
A.resetAll=()=>{
  if(!confirm('همه‌ی سفارش‌ها، منو، مشتریان و کاربران پاک می‌شود. ادامه می‌دهید؟'))return;
  if(!confirm('این کار قابل بازگشت نیست. مطمئن هستید؟'))return;
  localStorage.removeItem(KEY);sessionStorage.removeItem(SKEY);db=null;me=null;draft=null;render();
};

/* ورود و راه‌اندازی */
let fails=0,lockUntil=0;
FORMS.login=f=>{
  if(Date.now()<lockUntil)return toast('تلاش‌های ناموفق زیاد بود؛ ۳۰ ثانیه بعد دوباره امتحان کنید');
  const fd=new FormData(f),name=String(fd.get('u')).trim(),p=String(fd.get('p'));
  const u=db.users.find(x=>x.username.toLowerCase()===name.toLowerCase());
  if(u&&u.pass===passHash(u.username,p)){fails=0;me=u;cur='dashboard';sessionStorage.setItem(SKEY,u.id);render()}
  else{if(++fails>=5){lockUntil=Date.now()+30000;fails=0}toast('نام کاربری یا رمز عبور درست نیست')}
};
FORMS.setup=f=>{
  const fd=new FormData(f),cafe=String(fd.get('cafe')).trim()||'3House Cafe',u=String(fd.get('u')).trim(),p=String(fd.get('p'));
  if(!/^[\w.\-\u0600-\u06FF]{3,30}$/.test(u))return toast('نام کاربری باید ۳ تا ۳۰ نویسه (حرف، عدد، . _ -) باشد');
  if(p.length<6)return toast('رمز عبور حداقل ۶ نویسه باشد');
  const user={id:uid(),username:u,pass:passHash(u,p),role:'manager',personId:String(fd.get('pid')).trim(),perms:{}};
  db=seed(cafe,user);save();me=user;sessionStorage.setItem(SKEY,user.id);cur='dashboard';render();
};
FORMS.modalForm=f=>{
  const fd=new FormData(f),o={};
  formFields.forEach(x=>{const v=String(fd.get(x.k)??'');o[x.k]=x.t==='num'?toNum(v):x.t==='password'?v:v.trim()});
  if(formCb&&formCb(o)!==false)closeModal();
};

/* ───────── رویدادها ───────── */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;if(a==='modalBg'){if(e.target===el)closeModal();return}
  if(A[a])A[a](el.dataset.id,el);
});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.i;if(f&&I[f])I[f](e.target.value,e.target)});
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.c;if(f&&C[f])C[f](e.target.value,e.target)});
document.addEventListener('submit',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f&&FORMS[f]){e.preventDefault();FORMS[f](e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('hashchange',render);
/* همگام‌سازی چند تب در یک مرورگر */
window.addEventListener('storage',e=>{
  if(e.key!==KEY)return;
  db=load();if(me&&db)me=find(db.users,me.id)||null;
  if(!db||!me){render();return}
  if(!$('#modalRoot').innerHTML&&!(cur==='orders'&&draft))refresh();
});

/* شروع */
db=load();
try{const sid=sessionStorage.getItem(SKEY);if(db&&sid)me=find(db.users,sid)||null}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render();
</script>
</body>
</html>
